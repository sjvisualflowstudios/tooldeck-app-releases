name: Build signed APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.KS_PASS }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
            KS_PASS="$SECRET_KS_PASS"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
          else
            KS_PASS=$(openssl rand -hex 16)
            KEY_ALIAS=release
            keytool -genkeypair -v -keystore signing/release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=App Owner, O=App, C=US"
            echo "Keystore password: $KS_PASS" > signing/KEEP-THIS-PASSWORD.txt
            echo "Key alias: $KEY_ALIAS" >> signing/KEEP-THIS-PASSWORD.txt
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Upload signing key (keep private)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-keep-private
          path: signing/
